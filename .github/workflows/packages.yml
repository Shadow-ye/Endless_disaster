name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
    # 标签推送不受路径过滤影响，发布照常触发
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 公开仓库的 Actions 日志需要登录才能看，失败时把关键报错转成公开可见的注解
  REPORT_FAILURE: |
    log="$RUNNER_TEMP/build.log"
    [ -f "$log" ] || exit 0
    msg=$(grep -nE "error|Error|FAILED|fatal|No such file|not found" "$log" | tail -n 30 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
    [ -n "$msg" ] || msg=$(tail -n 30 "$log" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
    echo "::error title=$GITHUB_JOB failed::$msg"

jobs:
  deb:
    name: Debian package (.deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ dpkg-dev file \
            qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev

      - name: Build
        run: |
          set -o pipefail
          {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package
        run: |
          set -o pipefail
          # 输出同时进 build.log：失败时 Report failure 会把它做成公开可见的注解
          {
            cd build
            cpack -G DEB
            dpkg-deb --info endless-disaster_*.deb
            dpkg-deb --contents endless-disaster_*.deb
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Smoke test
        run: |
          set -o pipefail
          {
            sudo apt-get install -y ./build/endless-disaster_*.deb
            dpkg -l endless-disaster
            test -f /usr/share/endless-disaster/assets/hero_warrior/idle.png
            test -d /usr/share/endless-disaster/BGM
            code=0
            QT_QPA_PLATFORM=offscreen timeout 8 endless-disaster || code=$?
            if [ "$code" -ne 124 ]; then echo "endless-disaster exited early with code $code"; exit 1; fi
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/endless-disaster_*.deb

      - name: Report failure
        if: failure()
        run: eval "$REPORT_FAILURE"

  appimage:
    name: AppImage (universal Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build file patchelf desktop-file-utils libfuse2 \
            libgl1-mesa-dev libegl1 libfontconfig1 libpulse0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia'
          cache: true

      - name: Build
        run: |
          set -o pipefail
          {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build
            DESTDIR="$PWD/AppDir" cmake --install build
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Download linuxdeploy
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          LDAI_OUTPUT: EndlessDisaster-x86_64.AppImage
          OUTPUT: EndlessDisaster-x86_64.AppImage
        run: |
          set -o pipefail
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          # 只打包 Qt 自带的 FFmpeg 后端，播放 m4a 不依赖系统 GStreamer
          mkdir -p AppDir/usr/plugins/multimedia
          cp "$QT_ROOT_DIR"/plugins/multimedia/libffmpegmediaplugin.so AppDir/usr/plugins/multimedia/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/endless-disaster.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/endless-disaster.png \
            --deploy-deps-only AppDir/usr/plugins/multimedia \
            --plugin qt --output appimage 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          ls -la *.AppImage

      - name: Smoke test
        run: |
          chmod +x EndlessDisaster-x86_64.AppImage
          code=0
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 8 ./EndlessDisaster-x86_64.AppImage || code=$?
          if [ "$code" -ne 124 ]; then echo "AppImage exited early with code $code"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: EndlessDisaster-x86_64.AppImage

      - name: Report failure
        if: failure()
        run: eval "$REPORT_FAILURE"

  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 发布给手机的正式包
          - abi: arm64
            qt_arch: android_arm64_v8a
            artifact: apk
          # 仅供 CI 模拟器冒烟测试（x86_64 模拟器翻译 ARM 指令不可靠）
          - abi: x86_64
            qt_arch: android_x86_64
            artifact: apk-x86_64
    env:
      QT_VERSION: '6.8.3'
      NDK_VERSION: '26.1.10909125'
      APK_NAME: EndlessDisaster-android-${{ matrix.abi }}.apk
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Qt (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia'
          cache: true

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASS"
            alias="${KEY_ALIAS:-endless}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error title=Android signing::发布版本必须使用正式密钥：请在仓库 Secrets 中配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS（见 docs/android-signing.md）"
            exit 1
          else
            [ "${{ matrix.abi }}" = arm64 ] && echo "::warning title=Android signing::未配置 ANDROID_KEYSTORE_BASE64，本次使用临时签名；升级安装需先卸载旧版"
            pass="$(openssl rand -hex 16)"
            alias=endless
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Endless Disaster" > /dev/null
          fi
          echo "::add-mask::$pass"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$ks"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$alias"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$pass"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$pass"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          host="$(dirname "$QT_ROOT_DIR")/gcc_64"
          test -d "$host" || { echo "host Qt not found at $host" | tee "$RUNNER_TEMP/build.log"; exit 1; }
          {
            "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_HOST_PATH="$host" \
              -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
              -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
              -DQT_ANDROID_SIGN_APK=ON
            cmake --build build-android --target apk
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
          apk=$(find build-android -name "*-signed.apk" | head -n 1)
          if [ -z "$apk" ]; then find build-android -name "*.apk" | tee -a "$RUNNER_TEMP/build.log"; echo "signed apk not found" >> "$RUNNER_TEMP/build.log"; exit 1; fi
          cp "$apk" "$APK_NAME"

      - name: Inspect APK
        run: |
          tools="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          ls -la "$APK_NAME"
          "$tools/apksigner" verify "$APK_NAME"
          "$tools/aapt" dump badging "$APK_NAME" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)"
          info=$("$tools/aapt" dump badging "$APK_NAME" | grep -E "^(package|application-label|native-code)" | tr '\n' ' ')
          orient=$("$tools/aapt" dump xmltree "$APK_NAME" AndroidManifest.xml | grep -A0 -i "screenOrientation" | tr -s ' ' | tr '\n' ' ')
          cert=$("$tools/apksigner" verify --print-certs "$APK_NAME" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "::notice title=APK info (${{ matrix.abi }})::$info | $orient | size $(du -h "$APK_NAME" | cut -f1) | cert SHA-256 $cert"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.APK_NAME }}

      - name: Report failure
        if: failure()
        run: eval "$REPORT_FAILURE"

  android-smoke:
    name: Android emulator smoke test
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write smoke script
        run: |
          cat > smoke.sh <<'EOF'
          pkg=io.github.shadowye.endlessdisaster
          adb install -r EndlessDisaster-android-x86_64.apk || { echo "::error title=Android smoke::adb install failed"; exit 1; }
          adb logcat -c
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
          sleep 40
          pid=$(adb shell pidof "$pkg" | tr -d '\r')
          adb exec-out screencap -p > android-menu.png
          adb logcat -d > logcat.txt
          qtlog=$(grep -iE " (qt|libEndless|EndlessDisaster)" logcat.txt | grep -viE "qt\.qpa\.fonts" | tail -n 25 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$pid" ]; then
            echo "::notice title=Android smoke: app running after 40s (pid $pid)::$qtlog"
          else
            crash=$(grep -E "FATAL|AndroidRuntime|DEBUG|libc|qt" logcat.txt | tail -n 40 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android smoke: app not running::$crash"
            exit 1
          fi
          EOF

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            android-menu.png
            logcat.txt

  windows:
    name: Windows zip (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # 官方 Qt 自带精简 LGPL FFmpeg，windeployqt 会一并部署；MinGW 13.1 与这套 Qt 配套
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310 tools_ninja'
          cache: true

      - name: Build
        run: |
          $tools = if ($env:IQTA_TOOLS) { $env:IQTA_TOOLS } else { Join-Path $env:QT_ROOT_DIR '..\..\Tools' }
          $env:PATH = (Join-Path $tools 'Ninja') + ';' + $env:PATH
          ./packaging/windows/build-windows.ps1 -QtDir $env:QT_ROOT_DIR -MinGWDir (Join-Path $tools 'mingw1310_64') *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          if (-not (Test-Path dist/EndlessDisaster-windows-x64.zip)) { throw "zip not produced" }

      - name: Smoke test
        run: |
          # 只保留系统目录，确认包内 DLL 自给自足。Windows 指定系统播放器；FFmpeg 插件仍须出现在可用后端里。
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_LOGGING_RULES = 'qt.multimedia.plugin=true'
          $log = "$env:RUNNER_TEMP/smoke.log"
          $p = Start-Process dist/EndlessDisaster/EndlessDisaster.exe -RedirectStandardError $log -PassThru
          Start-Sleep 10
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Content $log
          if (-not $alive) { throw "EndlessDisaster.exe exited early with code $($p.ExitCode)" }
          if ((Select-String -Path $log -Pattern 'No QtMultimedia backends' -Quiet) -or
              -not (Select-String -Path $log -Pattern 'Available backends .*"ffmpeg"' -Quiet) -or
              -not (Select-String -Path $log -Pattern 'Loading media backend "windows"' -Quiet)) {
            throw "Windows multimedia backend did not load, or the FFmpeg plugin is missing"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/EndlessDisaster-windows-x64.zip

      - name: Report failure
        if: failure()
        shell: bash
        run: eval "$REPORT_FAILURE"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, appimage, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{deb,appimage,apk,windows}'
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Android

            - **`EndlessDisaster-android-arm64.apk`**：安卓安装包（Android 9+，arm64 手机）。下载后点击安装，需允许「安装未知来源应用」。
              操作：左下角摇杆移动并控制朝向；右下角「攻击」（点按轻击、长按重击），周围是闪避、防御、跳跃和技能；右上角「索敌」（自动朝向最近敌人，可开关）「说明」「暂停」。
              升级：v0.3.1 起使用固定签名，之后的新版本可直接覆盖安装并保留存档；手机上若装的是 v0.3.0，需先卸载一次再安装。

            ## Linux

            - **`EndlessDisaster-x86_64.AppImage`**：万能 Linux 包，自带 Qt 与音频解码，适用于大多数 x86_64 发行版（glibc ≥ 2.35，例如 Ubuntu 22.04+、Debian 12+、Fedora 36+）。
              下载后执行 `chmod +x EndlessDisaster-x86_64.AppImage && ./EndlessDisaster-x86_64.AppImage`。
              若提示缺少 FUSE，可安装 `libfuse2`，或加环境变量 `APPIMAGE_EXTRACT_AND_RUN=1` 运行。
            - **`endless-disaster_*_amd64.deb`**：Debian / Ubuntu 安装包（Ubuntu 22.04+、Debian 12+）。
              安装：`sudo apt install ./endless-disaster_*_amd64.deb`，之后在应用菜单中打开「无尽之灾」，或在终端运行 `endless-disaster`。
              中文出现方块字时请安装 `fonts-noto-cjk`。

            ## Windows

            - **`EndlessDisaster-windows-x64.zip`**：Windows 10 / 11（x64）可玩包，自带 Qt 与音频解码。解压到任意目录后双击 `EndlessDisaster.exe`。

            ## 历史版本

            各版本更新内容见 [README · 历史版本](https://github.com/Shadow-ye/Endless_disaster#历史版本)，旧版安装包都保留在 [全部 Releases](https://github.com/Shadow-ye/Endless_disaster/releases)。
